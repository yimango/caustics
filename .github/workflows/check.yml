name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake

      - name: Copy GLFW MinGW libraries
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "glfw.zip"
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP "glfw-3.4.bin.WIN64\lib-mingw-w64") "external\glfw-3.4.bin.WIN64\lib-mingw-w64"

      - name: Wave check
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          powershell -ExecutionPolicy Bypass -File verify/check.ps1

      - name: CMake build
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          cmake -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -S . -B build
          cmake --build build
